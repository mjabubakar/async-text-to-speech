services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    # This automatically writes the config flag directly inside the container filesystem before startup
    command: >
      bash -c "echo 'deprecated_features.permit.transient_nonexcl_queues = true' > /etc/rabbitmq/rabbitmq.conf && exec rabbitmq-server"

  redis:
    image: redis:8
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - rabbitmq
      - redis
    volumes:
      - audio_output:/app/audio_output

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    depends_on:
      - rabbitmq
      - redis
    volumes:
      - audio_output:/app/audio_output

volumes:
  audio_output:
