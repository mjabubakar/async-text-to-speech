x-app-env: &app-env
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
  REDIS_URL: redis://redis:6379/0

services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    command: >
      bash -c "echo 'deprecated_features.permit.transient_nonexcl_queues = true' > /etc/rabbitmq/rabbitmq.conf && exec rabbitmq-server"
    restart: unless-stopped

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      - rabbitmq
      - redis
    volumes:
      - audio_output:/app/audio_output
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      <<: *app-env
      TTS_CONCURRENCY: ${TTS_CONCURRENCY:-1}
    depends_on:
      - rabbitmq
      - redis
    volumes:
      - audio_output:/app/audio_output
    restart: unless-stopped

volumes:
  audio_output:
