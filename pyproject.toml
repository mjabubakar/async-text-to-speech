[project]
name = "docs-to-speech"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.3",
    "fastapi[standard]>=0.140.7",
    "nltk>=3.10.0",
    "pydantic>=2.13.4",
    "redis>=8.0.1",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
