<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Document to Speech</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 0 20px;
      }
      textarea {
        width: 100%;
        height: 200px;
        font-size: 1rem;
        padding: 8px;
        box-sizing: border-box;
      }
      button {
        margin-top: 10px;
        padding: 10px 20px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }
      #status {
        margin-top: 16px;
        font-size: 0.95rem;
      }
      #status.error {
        color: #b00020;
      }
      audio {
        width: 100%;
        margin-top: 16px;
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Document to Speech</h1>
    <textarea id="textInput" placeholder="Paste your text here..."></textarea>
    <br />
    <button id="submitBtn">Synthesize</button>
    <div id="status"></div>
    <audio id="player" controls></audio>

    <script>
      const submitBtn = document.getElementById("submitBtn");
      const textInput = document.getElementById("textInput");
      const statusEl = document.getElementById("status");
      const player = document.getElementById("player");

      const POLL_INTERVAL_MS = 2000;

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.className = isError ? "error" : "";
      }

      async function pollJob(jobId) {
        try {
          const res = await fetch(`/jobs/${jobId}`);
          if (!res.ok) {
            setStatus(`Error checking job status (${res.status})`, true);
            submitBtn.disabled = false;
            return;
          }
          const data = await res.json();

          if (data.status === "done") {
            setStatus("Done! Playing audio.");
            player.src = data.audio_url;
            player.style.display = "block";
            player.play();
            submitBtn.disabled = false;
          } else if (data.status === "failed") {
            setStatus(
              `Synthesis failed: ${data.error || "unknown error"}`,
              true,
            );
            submitBtn.disabled = false;
          } else {
            setStatus(`Status: ${data.status}...`);
            setTimeout(() => pollJob(jobId), POLL_INTERVAL_MS);
          }
        } catch (err) {
          setStatus(`Network error while polling: ${err.message}`, true);
          submitBtn.disabled = false;
        }
      }

      submitBtn.addEventListener("click", async () => {
        const text = textInput.value.trim();
        if (!text) {
          setStatus("Please enter some text first.", true);
          return;
        }

        submitBtn.disabled = true;
        player.style.display = "none";
        setStatus("Submitting...");

        try {
          const res = await fetch("/synthesize", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });

          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            setStatus(
              `Submission failed (${res.status}): ${JSON.stringify(err.detail || err)}`,
              true,
            );
            submitBtn.disabled = false;
            return;
          }

          const { job_id } = await res.json();
          setStatus("Queued. Waiting for processing...");
          pollJob(job_id);
        } catch (err) {
          setStatus(`Network error: ${err.message}`, true);
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
